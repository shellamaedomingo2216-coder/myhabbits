<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habits to Make Me Hotter</title>
<meta name="theme-color" content="#a98bf0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#fbf8ff;--card:#fff;--ink:#2b2340;--mute:#6b6089;--line:#e8def8;--cell:#f4eefd;--lav:#e6d6fb;--viol:#a98bf0;--deep:#7a58dd;--pink:#ffc9f3;--pk2:#f48ad2;--today:#fff0fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#19132b;--card:#241c3d;--ink:#f4eeff;--mute:#aea3cb;--line:#3a2f5c;--cell:#2f2650;--lav:#4a3a7a;--today:#3a2250;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#19132b;--card:#241c3d;--ink:#f4eeff;--mute:#aea3cb;--line:#3a2f5c;--cell:#2f2650;--lav:#4a3a7a;--today:#3a2250;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,sans-serif;padding:14px 12px 96px;max-width:680px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-size:19px;margin:0;font-weight:700}
button{font-family:inherit}
.pill,.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;height:36px;min-width:36px;font-weight:600;font-size:14px;padding:0 12px}
.pill.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.nav{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.mo{font-weight:600;font-size:15px;min-width:120px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ttl{font-size:12px;font-weight:700;letter-spacing:.04em;text-align:center;margin:0 0 8px}
.donut{display:block;margin:0 auto;width:170px;height:170px}
.donut text{font-family:inherit;fill:var(--ink)}
.legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.ch{width:100%;height:120px;display:block}
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table{border-collapse:separate;border-spacing:0;font-size:12px}
th,td{padding:0;text-align:center}
th.w{font-size:11px;font-weight:700;height:26px;border-left:2px solid var(--card);color:#3a2d5c}
th.dd{font-weight:600;color:var(--mute);line-height:1.15;padding:3px 0 5px;min-width:32px;font-size:12px;background:var(--cell)}
th.dd small{display:block;font-size:9px;font-weight:500}
