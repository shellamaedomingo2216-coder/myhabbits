<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habits to Make Me Hotter</title>
<meta name="theme-color" content="#a98bf0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#fbf8ff;--card:#fff;--ink:#2b2340;--mute:#8a7fa3;--line:#e8def8;--cell:#f4eefd;--lav:#e6d6fb;--viol:#a98bf0;--deep:#7a58dd;--pink:#ffc9f3;--pk2:#f48ad2;--today:#fff0fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#19132b;--card:#241c3d;--ink:#f4eeff;--mute:#aea3cb;--line:#3a2f5c;--cell:#2f2650;--lav:#4a3a7a;--today:#3a2250;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#19132b;--card:#241c3d;--ink:#f4eeff;--mute:#aea3cb;--line:#3a2f5c;--cell:#2f2650;--lav:#4a3a7a;--today:#3a2250;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,sans-serif;padding:14px 12px 96px;max-width:680px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-size:19px;margin:0;font-weight:700}
button{font-family:inherit}
.pill,.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;height:36px;min-width:36px;font-weight:600;font-size:14px;padding:0 12px}
.pill.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.nav{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.mo{font-weight:600;font-size:15px;min-width:120px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ttl{font-size:12px;font-weight:700;letter-spacing:.04em;text-align:center;margin:0 0 8px}
.donut{display:block;margin:0 auto;width:170px;height:170px}
.donut text{font-family:inherit;fill:var(--ink)}
.legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.ch{width:100%;height:120px;display:block}
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table{border-collapse:separate;border-spacing:0;font-size:12px}
th,td{padding:0;text-align:center}
th.w{font-size:11px;font-weight:700;height:26px;border-left:2px solid var(--card);color:#3a2d5c}
th.dd{font-weight:600;color:var(--mute);line-height:1.15;padding:3px 0 5px;min-width:32px;font-size:12px;background:var(--cell)}
th.dd small{display:block;font-size:9px;font-weight:500}
th.dd span{display:inline-block;min-width:22px;border-radius:11px;padding:1px 0}
th.dd.t span{background:var(--pk2);color:#fff}
.nm{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;min-width:128px;max-width:128px;padding:0 8px 0 4px;font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
th.nm{background:var(--cell);font-weight:700}
td.d{height:34px;border-left:2px solid var(--card)}
td.d.wk{border-left-color:var(--line)}
td.d.t{background:var(--today)}
.c{width:24px;height:24px;border-radius:7px;border:1.6px solid #cbb8f2;background:var(--card);padding:0;color:#fff;font-size:14px;line-height:1;display:block;margin:0 auto}
.c.on{background:var(--viol);border-color:var(--viol)}
.c.f{opacity:.5}
tr.pc td{height:26px;font-size:9.5px;color:var(--mute);font-weight:600}
.row{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;margin-bottom:10px;font-size:13px}
.row b{font-size:12.5px;color:var(--deep)}
.bar{grid-column:1/3;height:12px;background:var(--cell);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-radius:4px}
.sum{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.sum b{color:var(--ink)}
.ed{display:flex;gap:6px;margin-bottom:8px}
.ed input,.sheet input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:15px inherit;font-family:inherit}
.ed button{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font-weight:600}
.ed button.addb{background:var(--deep);color:#fff;border-color:var(--deep)}
.tabs{display:flex;gap:6px;background:var(--cell);padding:4px;border-radius:14px;margin-bottom:12px}
.tabs button{flex:1;height:36px;border:0;border-radius:10px;background:transparent;color:var(--mute);font-weight:600;font-size:13px}
.tabs button.on{background:var(--card);color:var(--deep);box-shadow:0 1px 4px rgba(122,88,221,.18)}
#jtext{width:100%;min-height:260px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:12px;font-size:15px;line-height:1.6;font-family:inherit;resize:vertical}
.je{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:8px;align-items:baseline}
.je.on{border-color:var(--viol);background:var(--cell)}
.je b{flex:none;font-size:14px;color:var(--deep);min-width:0}
.je span{font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.read{white-space:pre-wrap;word-wrap:break-word;font-size:16px;line-height:1.75}
.savebtn{display:block;width:100%;height:46px;margin-top:10px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--viol),var(--pk2));color:#fff;font-weight:700;font-size:15px}
.savebtn.ok{background:var(--cell);color:var(--deep)}
.mj{display:block;width:100%;height:46px;border:1px solid var(--line);background:var(--card);color:var(--deep);border-radius:14px;font-weight:600;font-size:14px;margin-bottom:12px}
h1{min-width:0}
.tool{display:block;margin:8px 0 0 auto;height:34px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:10px;padding:0 12px;font-weight:600;font-size:13px}
.stk{font-size:15px}.stk b{font-size:22px;color:var(--deep)}.stk span{color:var(--mute);font-size:12px;margin-left:8px}
.tr{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:56px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:15px;font-weight:500}
.tr:last-child{margin-bottom:0}.tr.on{background:var(--cell);border-color:var(--viol)}
.bx{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid #cbb8f2;display:grid;place-items:center;color:#fff;font-size:18px}
.tr.on .bx{background:var(--viol);border-color:var(--viol)}.tn{flex:1}.tr small{color:var(--mute);font-size:11px}
.padc{text-align:center}.dots{display:flex;justify-content:center;gap:14px;margin:12px 0 18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--viol)}.dots i.f{background:var(--viol)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.keys button{height:60px;border-radius:30px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;font-weight:600}
.moods{display:flex;gap:6px;margin-bottom:10px}
.moods button{flex:1;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;padding:0}
.moods button.on{background:var(--cell);border-color:var(--viol)}
.lb{display:flex;align-items:center;justify-content:center;margin:8px 0 0;cursor:pointer}
.ed select{flex:1;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 8px;font-family:inherit;font-size:13px}
.ed.sub{margin-top:-2px;margin-bottom:12px}.ed.sub button{width:48px;padding:0}
.hint{color:var(--mute);font-size:12px;text-align:center;margin:8px 0 0}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:54px;border-radius:27px;border:0;background:linear-gradient(135deg,var(--viol),var(--pk2));color:#fff;font-weight:700;font-size:15px;padding:0 20px 0 16px;box-shadow:0 6px 18px rgba(122,88,221,.4);z-index:5}
.ov{position:fixed;inset:0;background:rgba(30,20,60,.45);display:none;align-items:flex-end;z-index:10}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:680px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:17px}
.sheet .r{display:flex;gap:8px}
.sheet .go{height:42px;border:0;border-radius:12px;background:var(--deep);color:#fff;font-weight:700;padding:0 18px}
.emo{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.emo button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--cell);font-size:18px;padding:0}
</style>
</head>
<body>
<header>
  <h1>Habits to Make Me Hotter</h1>
  <div style="display:flex;gap:6px"><button class="pill" id="themeBtn" aria-label="Toggle dark mode">🌙</button><button class="pill" id="editBtn">Edit</button></div>
</header>
<div class="tabs"><button id="tD" class="on">Today</button><button id="tT">Tracker</button><button id="tJ">Journal</button><button id="tM">More</button></div>
<div class="nav" id="mnav"><button id="prev" aria-label="Previous month">‹</button><div class="mo" id="mo"></div><button id="next" aria-label="Next month">›</button></div>
<div id="app"></div>
<div id="td"></div>
<div id="jr" style="display:none"></div>
<div id="mr" style="display:none"></div>
<script>
var K='habit-tracker-v1',DEF=['Wake up at 6:00 AM ⏰','2L of water 💧','Workout 🏋️','Healthy breakfast 🍳','Project work 🎯','Reading time 📖','Walk outside 🚶','No junk food 🥦','Meditation 🧘','Journaling ✍️'];
var S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.habits){S={habits:DEF.map(function(n,i){return{id:'h'+i,name:n}}),log:{},n:DEF.length}}
if(!S.start)S.start='2026-10-22';
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var now=new Date(),Y=now.getFullYear(),M=now.getMonth(),edit=false;
var MN=['January','February','March','April','May','June','July','August','September','October','November','December'],WD=['S','M','T','W','T','F','S'];
var WC=['#f6d3ff','#e6d0fb','#d4c4f7','#c3c3f5','#c6d6fa'];
function key(){return Y+'-'+(M+1)}
function dim(){return new Date(Y,M+1,0).getDate()}
function lg(id){var k=key();S.log[k]=S.log[k]||{};S.log[k][id]=S.log[k][id]||[];return S.log[k][id]}
function isT(d){return Y==now.getFullYear()&&M==now.getMonth()&&d==now.getDate()}
function isF(d){return new Date(Y,M,d)>new Date(now.getFullYear(),now.getMonth(),now.getDate())}
function isPre(d){var p=S.start.split('-');return new Date(Y,M,d)<new Date(+p[0],p[1]-1,+p[2])}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function render(){
  var app=document.getElementById('app'),old=app.querySelector('.gridwrap'),sl=old?old.scrollLeft:null;
  var n=dim(),H=S.habits,hc=H.length;
  document.getElementById('mo').textContent=MN[M]+' '+Y;
  var eb=document.getElementById('editBtn');eb.textContent=edit?'Done':'Edit';eb.className='pill'+(edit?' on':'');
  var per=[],tot=0;
  for(var d=1;d<=n;d++){var c=0;H.forEach(function(h){if(lg(h.id).indexOf(d)>-1)c++});tot+=c;per.push(hc?c/hc:0)}
  var last=(Y==now.getFullYear()&&M==now.getMonth())?now.getDate():(new Date(Y,M,1)>now?0:n);for(var z=n;z>last;z--){if(per[z-1]>0){last=z;break}}var sd=1;while(sd<=n&&isPre(sd))sd++;var el=Math.max(0,last-sd+1);
  var pct=hc&&el?Math.round(tot/(hc*el)*100):0;
  var sp=S.start.split('-'),s0=new Date(+sp[0],sp[1]-1,+sp[2]),e0=new Date(+sp[0],sp[1],+sp[2]-1),td=new Date(now.getFullYear(),now.getMonth(),now.getDate()),wl=Math.round((e0-s0)/864e5)+1,cdone=0;
  for(var q=0;q<wl;q++){var dt=new Date(s0.getFullYear(),s0.getMonth(),s0.getDate()+q),lk=dt.getFullYear()+'-'+(dt.getMonth()+1),lo=S.log[lk];if(lo)H.forEach(function(x){if(lo[x.id]&&lo[x.id].indexOf(dt.getDate())>-1)cdone++})}
  var gsum=H.reduce(function(a,x){return a+(x.g||7)},0),cp=hc?Math.min(100,Math.round(cdone/(gsum*wl/7)*100)):0,dayN=td<s0?0:Math.min(wl,Math.round((td-s0)/864e5)+1),fin=td>e0;
  var h='<div class="card"><p class="ttl">MONTHLY PROGRESS</p>';
  var R=62,C=2*Math.PI*R;
  h+='<svg class="donut" viewBox="0 0 170 170"><circle cx="85" cy="85" r="'+R+'" fill="none" stroke="var(--cell)" stroke-width="20"/><circle cx="85" cy="85" r="'+R+'" fill="none" stroke="var(--pk2)" stroke-opacity=".55" stroke-width="20" stroke-dasharray="'+(C*cp/100).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 85 85)" stroke-linecap="butt"/><text x="85" y="88" text-anchor="middle" font-size="28" font-weight="600">'+cp+'%</text><text x="85" y="108" text-anchor="middle" font-size="11" style="fill:var(--mute)">'+(fin?'Completed 🎉':(dayN?'Day '+dayN+' of '+wl:'Starts '+S.start))+'</text></svg>';
  h+='<div class="legend"><span><i style="background:var(--pk2);opacity:.55"></i>Completed '+cp+'%</span><span><i style="background:var(--cell)"></i>Left '+(100-cp)+'%</span></div></div>';
  var W=300,Hh=100,pts=[];per.forEach(function(v,i){if(i+1>=sd&&i+1<=last)pts.push([(n>1?i/(n-1):0)*W,Hh-v*(Hh-8)-3])});if(pts.length==1)pts.push([Math.min(W,pts[0][0]+5),pts[0][1]]);var xs=pts.length?pts[0][0]:0,xe=pts.length?pts[pts.length-1][0]:0;
  var line=pts.map(function(p,i){return(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ');
  h+='<div class="card"><p class="ttl">DAILY PROGRESS</p><svg class="ch" viewBox="0 0 '+W+' '+Hh+'" preserveAspectRatio="none">';
  [25,50,75,100].forEach(function(g){var y=Hh-g/100*(Hh-8)-3;h+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>'});
  h+='<path d="'+line+' L'+xe+' '+Hh+' L'+xs+' '+Hh+' Z" fill="#c9b3f7" fill-opacity=".45"/><path d="'+line+'" fill="none" stroke="#a98bf0" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></div>';
  h+='<div class="card">';
  if(edit){
    h+='<p class="ttl">YOUR HABITS</p><div class="ed"><span style="align-self:center;font-size:13px;flex:none">Start date</span><input type="date" id="sdate" value="'+S.start+'"></div><div class="ed"><input id="newHabit" placeholder="Add a new habit, e.g. Drink water 💧" maxlength="40"><button class="addb" id="addHabit">Add</button></div>';
    H.forEach(function(x){var g=x.g||7,o='';for(var q=7;q>=1;q--)o+='<option value="'+q+'"'+(q==g?' selected':'')+'>'+(q==7?'Every day':q+'× a week')+'</option>';h+='<div class="ed"><input value="'+esc(x.name)+'" data-id="'+x.id+'" class="rn" maxlength="40"><button data-del="'+x.id+'" aria-label="Delete habit">✕</button></div><div class="ed sub"><select class="gs" data-id="'+x.id+'">'+o+'</select><button data-mv="'+x.id+'" data-dir="-1" aria-label="Move up">▲</button><button data-mv="'+x.id+'" data-dir="1" aria-label="Move down">▼</button></div>'});
    if(!hc)h+='<p class="hint">Nothing here yet. Type a habit above and tap Add.</p>';
  }else{
    h+='<div class="gridwrap"><table><thead><tr><th class="nm" rowspan="2">My habits</th>';
    for(var w=0;w<5;w++){var s=1+w*7;if(s>n)break;var e=Math.min(n,s+6);h+='<th class="w" colspan="'+(e-s+1)+'" style="background:'+WC[w]+'">WEEK '+(w+1)+'</th>'}
    h+='</tr><tr>';
    for(var d=1;d<=n;d++){h+='<th class="dd'+(isT(d)?' t':'')+'"><small>'+WD[new Date(Y,M,d).getDay()]+'</small><span>'+d+'</span></th>'}
    h+='</tr></thead><tbody>';
    H.forEach(function(x){
      h+='<tr><td class="nm">'+esc(x.name)+'</td>';
      var L=lg(x.id);
      for(var d=1;d<=n;d++){var on=L.indexOf(d)>-1;h+='<td class="d'+(isT(d)?' t':'')+((d-1)%7==0&&d>1?' wk':'')+'"><button class="c'+(on?' on':'')+((isF(d)||isPre(d))&&!on?' f':'')+'" '+(isPre(d)?'disabled ':'')+'data-h="'+x.id+'" data-d="'+d+'" aria-label="'+esc(x.name)+' day '+d+'">'+(on?'✓':'')+'</button></td>'}
      h+='</tr>';
    });
    h+='<tr class="pc"><td class="nm" style="font-size:11px;color:var(--mute)">Daily %</td>';
    for(var d=1;d<=n;d++){h+='<td>'+(isF(d)||isPre(d)?'':Math.round(per[d-1]*100)+'%')+'</td>'}
    h+='</tr></tbody></table></div>';
    if(!hc)h+='<p class="hint">No habits yet. Tap Edit to add your first one.</p>';
  }
  h+='</div>';
  h+='<div class="card"><p class="ttl">PROGRESS</p>';
  H.forEach(function(x){var g=x.g||7,a=lg(x.id).length,ex=el*g/7,p=ex?Math.min(100,Math.round(a/ex*100)):0;h+='<div class="row"><span>'+esc(x.name)+'</span><b>'+p+'%</b><div class="bar"><i style="width:'+Math.min(100,p)+'%"></i></div></div>'});
  h+='<div class="sum"><span><b>'+cp+'%</b> completed</span><span><b>'+(100-cp)+'%</b> left to complete</span></div></div>';
  app.innerHTML=h;
  var gw=app.querySelector('.gridwrap');
  if(gw){if(sl!==null)gw.scrollLeft=sl;else if(Y==now.getFullYear()&&M==now.getMonth())gw.scrollLeft=Math.max(0,(now.getDate()-4)*34)}
}
function addHabit(){var inp=document.getElementById('newHabit'),v=inp.value.trim();if(!v)return;S.habits.push({id:'h'+(S.n++),name:v});save();render();var ni=document.getElementById('newHabit');if(ni)ni.focus()}
document.getElementById('app').addEventListener('click',function(e){
  var t=e.target;
  if(t.id=='addHabit'){addHabit();return}
  if(t.dataset.h){var L=lg(t.dataset.h),d=+t.dataset.d,i=L.indexOf(d);if(i>-1)L.splice(i,1);else L.push(d);save();render();return}
  if(t.dataset.mv){var ix=S.habits.findIndex(function(x){return x.id==t.dataset.mv}),j2=ix+ +t.dataset.dir;if(j2>=0&&j2<S.habits.length){var tmp=S.habits[ix];S.habits[ix]=S.habits[j2];S.habits[j2]=tmp;save();render()}return}
  if(t.dataset.del){S.habits=S.habits.filter(function(x){return x.id!=t.dataset.del});save();render()}
});
document.getElementById('app').addEventListener('change',function(e){
  if(e.target.classList.contains('gs')){S.habits.forEach(function(x){if(x.id==e.target.dataset.id)x.g=+e.target.value});save();return}
  if(e.target.id=='sdate'&&e.target.value){S.start=e.target.value;save();render();return}
  if(e.target.classList.contains('rn')){var v=e.target.value.trim();S.habits.forEach(function(x){if(x.id==e.target.dataset.id&&v)x.name=v});save()}
});
document.getElementById('app').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='newHabit')addHabit()});
document.getElementById('editBtn').onclick=function(){edit=!edit;render()};
document.getElementById('prev').onclick=function(){M--;if(M<0){M=11;Y--}render()};
document.getElementById('next').onclick=function(){M++;if(M>11){M=0;Y++}render()};
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function pd(k){var p=k.split('-');return new Date(+p[0],p[1]-1,+p[2])}
var jd=ymd(new Date()),jread=false,jopen=false,jundo=null;
function renderList(){var J=S.journal||{},ks=Object.keys(J).filter(function(k){return J[k].trim()}).sort().reverse(),h='';
  ks.forEach(function(k){h+='<button class="je'+(k==jd?' on':'')+'" data-k="'+k+'"><b>'+pd(k).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</b></button>'});
  document.getElementById('jlist').innerHTML=h||'<p class="hint">Your journals will show up here.</p>'}
function renderJ(){var J=S.journal||{},el=document.getElementById('jr');
  if(jread&&J[jd]&&J[jd].trim()){el.innerHTML='<div class="card"><div class="nav" style="margin-bottom:10px;justify-content:space-between"><button id="jb">‹ Back</button><button class="pill on" id="je_">Edit</button></div><p class="ttl" style="text-align:left;font-size:13px;margin-bottom:12px">'+pd(jd).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})+((S.moods&&S.moods[jd])?' '+S.moods[jd]:'')+'</p><div class="read">'+esc(J[jd])+'</div></div><button class="mj" id="jtog">'+(jopen?'My Journals ▴':'My Journals ▾')+'</button><div class="card" id="jwrap" style="'+(jopen?'':'display:none')+'"><div id="jlist"></div></div>';renderList();return}
  el.innerHTML='<div class="card"><div class="nav" style="margin-bottom:8px"><button id="jp" aria-label="Previous day">‹</button><div class="mo" style="min-width:0;flex:1;font-size:13px">'+pd(jd).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</div><button id="jt">Today</button><button id="jn" aria-label="Next day">›</button></div>'+moodHTML()+'<textarea id="jtext" placeholder="How was your day? Write anything…">'+esc((S.drafts&&S.drafts[jd]!==undefined)?S.drafts[jd]:(J[jd]||''))+'</textarea><button class="tool" id="jclr">'+(jundo&&jundo.d==jd?'↩ Undo':'🗑 Clear all')+'</button><button class="savebtn'+(jdirty()?'':' ok')+'" id="jsave">'+jlab()+'</button><p class="hint">Tap Save to keep this entry.</p></div><button class="mj" id="jtog">'+(jopen?'My Journals ▴':'My Journals ▾')+'</button><div class="card" id="jwrap" style="'+(jopen?'':'display:none')+'"><div id="jlist"></div></div>';
  renderList()}
function jdirty(){var D=S.drafts||{},J=S.journal||{};return D[jd]!==undefined&&D[jd]!==(J[jd]||'')}
function jlab(){var J=S.journal||{};return jdirty()?'Save':(J[jd]&&J[jd].trim()?'Saved ✓':'Save')}
function updSave(){var b=document.getElementById('jsave');if(b){b.textContent=jlab();b.className='savebtn'+(jdirty()?'':' ok')}}
function jshift(n){var d=pd(jd);jd=ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n));renderJ()}
document.getElementById('jr').addEventListener('click',function(e){var t=e.target,b=t.closest?t.closest('[data-k]'):null;
  if(b){jd=b.dataset.k;jread=true;jopen=false;renderJ();window.scrollTo(0,0);return}
  if(t.id=='jp')jshift(-1);else if(t.id=='jn')jshift(1);else if(t.id=='jt'){jd=ymd(new Date());renderJ()}else if(t.id=='jb'){jd=ymd(new Date());jread=false;renderJ()}else if(t.id=='je_'){jread=false;renderJ()}else if(t.id=='jsave'){S.journal=S.journal||{};var v=(S.drafts&&S.drafts[jd]!==undefined)?S.drafts[jd]:(S.journal[jd]||'');if(v.trim())S.journal[jd]=v;else delete S.journal[jd];if(S.drafts)delete S.drafts[jd];save();updSave();renderList()}else if(t.id=='jpn'){jpoff++;renderJ()}else if(t.dataset.m){S.moods=S.moods||{};S.moods[jd]=S.moods[jd]==t.dataset.m?'':t.dataset.m;save();var ms=t.parentNode.children;for(var q=0;q<ms.length;q++)ms[q].className=ms[q].dataset.m==S.moods[jd]?'on':''}else if(t.id=='jclr'){var ta=document.getElementById('jtext');if(jundo&&jundo.d==jd){ta.value=jundo.t;jundo=null}else{if(!ta.value)return;jundo={d:jd,t:ta.value};ta.value=''}S.drafts=S.drafts||{};S.drafts[jd]=ta.value;save();t.textContent=jundo?'↩ Undo':'🗑 Clear all';updSave()}else if(t.id=='jtog'){jopen=!jopen;document.getElementById('jwrap').style.display=jopen?'':'none';t.textContent=jopen?'My Journals ▴':'My Journals ▾'}});
document.getElementById('jr').addEventListener('input',function(e){if(e.target.id=='jtext'){S.drafts=S.drafts||{};S.drafts[jd]=e.target.value;save();updSave();if(jundo){jundo=null;var cb=document.getElementById('jclr');if(cb)cb.textContent='🗑 Clear all'}}});
function setView(v){var ids={d:'tD',t:'tT',j:'tJ',m:'tM'};for(var x in ids)document.getElementById(ids[x]).className=x==v?'on':'';
  var sh=function(id,on){document.getElementById(id).style.display=on?'':'none'};
  sh('td',v=='d');sh('app',v=='t');sh('mnav',v=='t');sh('editBtn',v=='t');sh('jr',v=='j');sh('mr',v=='m');
  if(v!='j')unlocked=false;
  if(v=='d')renderToday();else if(v=='t')render();else if(v=='m')renderMore();
  else{jread=false;jopen=false;if(S.pin&&!unlocked)showLock();else renderJ()}}
function applyTheme(t){var r=document.documentElement;if(t)r.setAttribute('data-theme',t);var a=r.getAttribute('data-theme'),dk=a?a==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.getElementById('themeBtn').textContent=dk?'☀️':'🌙';return dk}
applyTheme(S.theme);
document.getElementById('themeBtn').onclick=function(){var t=applyTheme()?'light':'dark';S.theme=t;applyTheme(t);save()};
var unlocked=false,jpoff=0,fg=false;
var PR=['What went well today?','What are you grateful for?','What was hard today, and how did you handle it?','What did you learn today?','What are you looking forward to?','Who made your day better?','What would make tomorrow great?'];
function moodHTML(){var m=(S.moods||{})[jd]||'';return'<div class="moods">'+['😄','🙂','😐','😔','😡'].map(function(x){return'<button data-m="'+x+'" class="'+(x==m?'on':'')+'" aria-label="Mood">'+x+'</button>'}).join('')+'</div><p class="hint" id="jpn" style="text-align:left;margin:0 0 8px;cursor:pointer">💭 '+PR[(Math.floor(pd(jd)/864e5)+jpoff)%7]+' ↻</p>'}
function hp(s){var x=0;for(var i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))%1000003;return'p'+x}
function kk(dt){return dt.getFullYear()+'-'+(dt.getMonth()+1)}
function has(id,dt){var o=S.log[kk(dt)];return !!(o&&o[id]&&o[id].indexOf(dt.getDate())>-1)}
function setHas(id,dt,on){var k=kk(dt);S.log[k]=S.log[k]||{};var L=S.log[k][id]=S.log[k][id]||[],i=L.indexOf(dt.getDate());if(on&&i<0)L.push(dt.getDate());if(!on&&i>-1)L.splice(i,1)}
function today0(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function addD(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function streaks(){var H=S.habits,E=H.filter(function(x){return(x.g||7)>=7});if(!H.length)return[0,0];var T=today0(),d=pd(S.start),run=0,best=0;
  for(;d<=T;d=addD(d,1)){var dd=d,ok=E.length?E.every(function(x){return has(x.id,dd)}):H.some(function(x){return has(x.id,dd)});if(ok){run++;if(run>best)best=run}else if(d<T)run=0}
  return[run,best]}
function wk(x){var T=today0(),d=addD(T,-T.getDay()),n=0;for(;d<=T;d=addD(d,1))if(has(x.id,d))n++;return n}
function renderToday(){var el=document.getElementById('td'),H=S.habits,T=today0(),done=H.filter(function(x){return has(x.id,T)}).length,st=streaks(),pc=H.length?Math.round(done/H.length*100):0;
  var h='<div class="card"><p class="ttl" style="text-align:left;font-size:14px;margin-bottom:6px">'+T.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</p><div class="stk">🔥 <b>'+st[0]+'</b> day streak <span>Best '+st[1]+'</span></div><div class="bar" style="height:14px;margin-top:10px"><i style="width:'+pc+'%"></i></div><p class="hint">'+(H.length&&done==H.length?'All done today! 🎉':done+' of '+H.length+' done')+'</p></div><div class="card">';
  H.forEach(function(x){var on=has(x.id,T),g=x.g||7;h+='<button class="tr'+(on?' on':'')+'" data-th="'+x.id+'"><span class="bx">'+(on?'✓':'')+'</span><span class="tn">'+esc(x.name)+'</span>'+(g<7?'<small>'+wk(x)+'/'+g+' this week</small>':'')+'</button>'});
  if(!H.length)h+='<p class="hint">No habits yet. Go to Tracker and tap Edit to add some.</p>';
  el.innerHTML=h+'</div>'}
document.getElementById('td').addEventListener('click',function(e){var b=e.target.closest('[data-th]');if(b){var T=today0(),id=b.dataset.th;setHas(id,T,!has(id,T));save();renderToday()}});
function pad(el,title,cb){var v='';function draw(){el.innerHTML='<div class="card padc"><p class="ttl">'+title+'</p><div class="dots">'+[0,1,2,3].map(function(i){return'<i class="'+(i<v.length?'f':'')+'"></i>'}).join('')+'</div><div class="keys">'+[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(function(k){return k===''?'<span></span>':'<button data-p="'+k+'">'+k+'</button>'}).join('')+'</div></div>'}
  el.onclick=function(e){var k=e.target.dataset?e.target.dataset.p:undefined;if(k===undefined)return;if(k==='⌫')v=v.slice(0,-1);else v+=k;if(v.length==4){var p=v;el.onclick=null;cb(p)}else draw()};draw()}
function showLock(m){pad(document.getElementById('jr'),m||'Enter your PIN',function(p){if(hp(p)==S.pin){unlocked=true;jread=false;jopen=false;renderJ()}else showLock('Wrong PIN, try again')})}
function applyZoom(){document.body.style.zoom=[1,1.12,1.25][S.fs||0]}
function renderMore(msg){var el=document.getElementById('mr'),fs=S.fs||0;fg=false;
  el.innerHTML=(msg?'<p class="hint" style="color:var(--deep);font-weight:600;margin:0 0 10px">'+msg+'</p>':'')
  +'<div class="card"><p class="ttl">TEXT SIZE</p><div class="nav" style="margin:0"><button id="fsm">A−</button><div class="mo" style="min-width:110px">'+['Normal','Large','Extra large'][fs]+'</div><button id="fsp">A+</button></div></div>'
  +'<div class="card"><p class="ttl">JOURNAL PIN</p><p class="hint" style="margin:0 0 10px">'+(S.pin?'Your journal is locked with a PIN.':'Add a 4-digit PIN to keep your journal private.')+'</p><button class="mj" id="pset" style="margin:0">'+(S.pin?'Change PIN':'Set PIN')+'</button>'+(S.pin?'<button class="mj" id="prem" style="margin:8px 0 0">Remove PIN</button><button class="mj" id="pfor" style="margin:8px 0 0;color:var(--mute)">Forgot PIN? Reset</button>':'')+'<p class="hint">Resetting a forgotten PIN erases your journal entries (habits stay).</p></div>'
  +'<div class="card"><p class="ttl">BACKUP</p><button class="mj" id="bdl" style="margin:0">Download backup</button><button class="mj" id="bcp" style="margin:8px 0 0">Copy backup</button><label class="mj lb" for="bfile">Restore from backup file</label><input type="file" id="bfile" accept=".json,application/json" hidden><p class="hint">A backup has your habits and journal.</p></div>'
  +'<div class="card"><p class="ttl">INSTALL</p><p class="hint" style="margin:0">Open your browser menu ⋮ and tap Add to Home screen to use it like an app.</p></div>'}
document.getElementById('mr').addEventListener('click',function(e){var t=e.target,el=document.getElementById('mr');
  if(t.id=='fsm'||t.id=='fsp'){S.fs=Math.max(0,Math.min(2,(S.fs||0)+(t.id=='fsp'?1:-1)));save();applyZoom();renderMore()}
  else if(t.id=='pset'){pad(el,'Choose a 4-digit PIN',function(a){pad(el,'Enter it again',function(b){if(a==b){S.pin=hp(a);save();renderMore('PIN saved ✓')}else renderMore('The PINs didn’t match. Try again.')})})}
  else if(t.id=='prem'){pad(el,'Enter your current PIN',function(a){if(hp(a)==S.pin){delete S.pin;save();renderMore('PIN removed')}else renderMore('Wrong PIN')})}
  else if(t.id=='pfor'){if(!fg){fg=true;t.textContent='Tap again to erase journal and remove PIN'}else{delete S.pin;S.journal={};S.drafts={};S.moods={};save();renderMore('PIN reset. Journal erased.')}}
  else if(t.id=='bdl'){try{var b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='habit-backup-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove()}catch(x){renderMore('Download didn’t work. Try Copy backup.')}}
  else if(t.id=='bcp'){try{navigator.clipboard.writeText(JSON.stringify(S)).then(function(){renderMore('Backup copied ✓')},function(){renderMore('Copy didn’t work. Try Download backup.')})}catch(x){renderMore('Copy didn’t work. Try Download backup.')}}});
document.getElementById('mr').addEventListener('change',function(e){if(e.target.id=='bfile'){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.habits)throw 0;S=o;if(!S.log)S.log={};if(!S.start)S.start='2026-10-22';save();applyZoom();applyTheme(S.theme);renderMore('Backup restored ✓')}catch(x){renderMore('That file isn’t a valid backup.')}};r.readAsText(f)}});
['D','T','J','M'].forEach(function(k){document.getElementById('t'+k).onclick=function(){setView(k.toLowerCase())}});
applyZoom();
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(function(){})}catch(x){}
render();setView('d');
</script>
</body>
